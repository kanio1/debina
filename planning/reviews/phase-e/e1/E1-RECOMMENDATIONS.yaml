      - Approval is optional Debina prefix after intake; exclude from E1 smoke to avoid maker-checker duplication.
    confirmed_claims:
      - Concept separation envelope/message/instruction/order/transaction.
      - One PmtInf and one CdtTrfTxInf for E1 semantic boundary.
      - Upload is not clearing acceptance or settlement.
    incorrect_claims:
