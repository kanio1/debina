      - Confirm ReqdExctnDt inclusion in minimal E1 outcome.
    recommended_decisions:
      - Actor goal wording accepted payment instruction lineage linked to existing detail.
      - Evidence-only for B-path signature failure; visible rejected record for post-verify validation failure with safe correlation.
      - ReqdExctnDt DEFER_FROM_E1 minimal persistence; validate when admitted.
      - Approval excluded from E1 smoke.
    rejected_alternatives:
      - Payment aggregate equals one XML document.
      - Multi-item partial processing in E1.
    blocking_questions:
