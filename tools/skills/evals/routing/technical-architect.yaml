skill: technical-architect
scenarios:
  - {kind: positive, prompt: "Rename a private helper with no behaviour change", expected: [technical-architect], must_not: [enterprise-use-case-engineering, business-analyst], first: "accept NO_USE_CASE_CHANGE", forbidden: "create a use case", evidence: ["NO_USE_CASE_CHANGE", "PIPELINE_IMPACT"]}
  - {kind: positive, prompt: "Plan a quick tooling spike after readiness is NOT_APPLICABLE", expected: [technical-architect], must_not: [product-manager], first: "inspect current code", forbidden: "invent actor", evidence: ["technical plan", "≤10"]}
  - {kind: positive, prompt: "Produce PIPELINE_IMPACT for a backend unit-test-only change", expected: [technical-architect], must_not: [dagger-go-pipeline], first: "classify NONE", forbidden: "modify Dagger", evidence: ["PIPELINE_IMPACT", "NONE"]}
  - {kind: positive, prompt: "Plan after PRE_PLAN_READINESS READY for a normal feature", expected: [technical-architect], must_not: [], first: "consume READY verdict", forbidden: "plan before READY", evidence: ["PRE_PLAN_READINESS", "READY"]}
  - {kind: negative, prompt: "Implement a new settlement flow before readiness", expected: [business-analyst, enterprise-use-case-engineering, planning-semantic-integrity], must_not: [technical-architect], first: "complete PRE_PLAN_READINESS", forbidden: "jump to plan", evidence: ["READY"]}
  - {kind: negative, prompt: "Select the next genuinely READY story", expected: [artifact-derived-planning], must_not: [technical-architect], first: "classify readiness", forbidden: "start coding", evidence: ["READY"]}
  - {kind: negative, prompt: "Change Dagger Maven cache layout", expected: [dagger-go-pipeline], must_not: [technical-architect], first: "load dagger-go-pipeline", forbidden: "BA use case", evidence: ["cache"]}
  - {kind: negative, prompt: "Resume the interrupted session", expected: [session-handoff], must_not: [technical-architect], first: "read HANDOFF Resume from here", forbidden: "renegotiate", evidence: ["Resume from here"]}
  - {kind: overlap, prompt: "Add a migration used by composed database-upgrade verification", expected: [technical-architect, postgres-rls-migration, dagger-go-pipeline], must_not: [], first: "classify PIPELINE_IMPACT", forbidden: "redesign pipeline without impact", evidence: ["PIPELINE_IMPACT", "EXISTING_CHECK_SUFFICIENT"]}
  - {kind: overlap, prompt: "Review completed implementation before commit", expected: [technical-architect], must_not: [enterprise-use-case-engineering], first: "independent read-only review", forbidden: "second planning cycle", evidence: ["BLOCKER", "HIGH"]}
  - {kind: pressure, prompt: "Skip PRE_PLAN_READINESS because the story looks obvious", expected: [technical-architect], must_not: [], first: "require READY for behaviour change", forbidden: "plan without verdict", evidence: ["PRE_PLAN_READINESS"]}
  - {kind: pressure, prompt: "Add one Dagger callable per new test class", expected: [technical-architect, dagger-go-pipeline], must_not: [], first: "reuse existing checks", forbidden: "callable per class", evidence: ["PIPELINE_IMPACT"]}
